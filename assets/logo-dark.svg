<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" fill="none">
  <defs>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: three nested arcs representing Chochmah, Binah, Da'at -->
  <g transform="translate(20, 20)">
    <path d="M50 90 C50 50, 10 20, 50 0" stroke="#7C3AED" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M50 90 C50 40, 0 10, 50 0" stroke="#A78BFA" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M50 90 C50 30, -10 0, 50 0" stroke="#C084FC" stroke-width="3" fill="none" opacity="0.9"/>
    <circle cx="50" cy="0.5" r="5" fill="#7C3AED"/>
    <circle cx="45.5" cy="45" r="4" fill="#A78BFA"/>
    <circle cx="50" cy="85" r="6" fill="url(#grad-dark)"/>
  </g>
  <!-- Text -->
  <text x="140" y="85" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    <tspan fill="#A78BFA">F</tspan><tspan fill="#CBD5E1">eatures</tspan>
  </text>
  <text x="142" y="115" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="3">
    BETTER RESULTS. FEWER TOKENS.
  </text>
</svg>
