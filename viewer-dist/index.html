<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1fb" />
    <title>Features</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('features-theme') || 'light';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="/assets/raise.css" />
    <script type="module" src="/assets/raise-app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to Main Content</a>
    <div id="app" aria-live="polite">
      <div class="loading-screen" role="status">Loading…</div>
    </div>
  </body>
</html>
